services:
  - type: web
    name: clipforgeai
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: APP_BASE_URL
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: APP_SESSION_SECRET
        sync: false
      - key: MEDIA_SIGNING_KEY
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: YOUTUBE_CLIENT_SECRET
        sync: false
      - key: META_CLIENT_ID
        sync: false
      - key: META_CLIENT_SECRET
        sync: false
      - key: TIKTOK_CLIENT_ID
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: X_CLIENT_ID
        sync: false
      - key: X_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: META_GRAPH_VERSION
        value: v23.0
      - key: LINKEDIN_VERSION
        value: 202609
    disk:
      name: clipforgeai-data
      mountPath: /app/backend/data
      sizeGB: 10
