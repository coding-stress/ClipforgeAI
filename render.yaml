services:
  - type: web
    name: clipforgeai
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: APP_SESSION_SECRET
        generateValue: true
      - key: MEDIA_SIGNING_KEY
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: CLIPFORGEAI_DEMO_MODE
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
